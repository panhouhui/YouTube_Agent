settings:
  log_directory: "log"
  cache_directory: "runtime/youtube/cache"
  state_directory: "runtime/youtube/state"

actors:
  channel:
    config:
      db_path: "runtime/youtube/db"
    entities:
      - name: "youtube keyword search"
        url: "https://www.youtube.com/results?search_query=YouTube"
        keywords_file: "keywords.general.txt"
        keywords_per_update: 5
        env_file: ".env"
        cookie_env: "YouTube_cookie"
        max_age_hours: 24
        update_interval: 900
        quiet_first_time: true
        max_continuation_depth: 5

      - name: "youtube HK keyword search"
        url: "https://www.youtube.com/results?search_query=Hong+Kong"
        keywords_file: "keywords.hk.txt"
        keywords_per_update: 5
        env_file: ".env"
        cookie_env: "YouTube_cookie"
        max_age_hours: 24
        update_interval: 900
        quiet_first_time: true
        max_continuation_depth: 5

      - name: "youtube TW keyword search"
        url: "https://www.youtube.com/results?search_query=Taiwan"
        keywords_file: "keywords.tw.txt"
        keywords_per_update: 5
        env_file: ".env"
        cookie_env: "YouTube_cookie"
        max_age_hours: 24
        update_interval: 900
        quiet_first_time: true
        max_continuation_depth: 5

      - name: youtube APEC search
        url: https://www.youtube.com/results?search_query=APEC
        keywords_file: keywords.apec.txt
        keywords_per_update: 1
        env_file: .env
        cookie_env: YouTube_cookie
        max_age_hours: 24
        update_interval: 900
        quiet_first_time: true
        max_continuation_depth: 5
  youtube.community:
    config:
      db_path: "runtime/youtube/db"
    entities:
      - name: "jintsumi community posts"
        url: "https://www.youtube.com/@jintsumi/posts"
        env_file: ".env"
        cookie_env: "YouTube_cookie"
        update_interval: 300
        quiet_first_time: true
        max_continuation_depth: 0

  filter.match:
    entities:
      - name: "youtube keywords"
        patterns_file: "keywords.general.txt"
        fields:
          - "title"
          - "summary"
          - "author"

      - name: "youtube HK keywords"
        patterns_file: "keywords.hk.txt"
        fields:
          - "title"
          - "summary"
          - "author"

      - name: "youtube TW keywords"
        patterns_file: "keywords.tw.txt"
        fields:
          - "title"
          - "summary"
          - "author"

      - name: apec keyword
        patterns_file: keywords.apec.txt
        fields:
          - title
          - summary
          - author
  filter.deduplicate:
    entities:
      - name: "youtube video deduplicate"
        field: "video_id"

      - name: "youtube HK video deduplicate"
        field: "video_id"

      - name: "youtube TW video deduplicate"
        field: "video_id"

      - name: apec video deduplicate
        field: video_id
  minimax.analyze:
    config:
      env_file: ".env"
      consumption_delay: 1
    entities:
      - name: "anti-china review"
        keywords_file: "keywords.general.txt"
        keyword_group: "general"
        min_confidence: 0.65
      - name: "hk anti-china review"
        keywords_file: "keywords.hk.txt"
        keyword_group: "hk"
        min_confidence: 0.65
      - name: "tw anti-china review"
        keywords_file: "keywords.tw.txt"
        keyword_group: "tw"
        min_confidence: 0.65
      - name: "apec anti-china review"
        keywords_file: "keywords.apec.txt"
        keyword_group: "apec"
        min_confidence: 0.65
        analysis_mode: "apec_risk"
        source_name: "YouTube"
        source_url: "https://www.youtube.com/results?search_query=APEC"
      - name: "jintsumi community analysis"
        analysis_mode: "profile_update"
        source_name: "@jintsumi"
        source_url: "https://www.youtube.com/@jintsumi/posts"
        min_confidence: 0

  youtube.keyword_agents:
    config:
      db_path: "runtime/youtube/db"
      feed_name: "youtube keyword search"
      stats_window_hours: 24
      baseline_window_hours: 168
      top_accounts_limit: 5
    entities:
      - name: "yt collector agent record"
        agent_role: "collector"
      - name: "yt key accounts agent record"
        agent_role: "key_accounts"
        key_accounts_file: "key_accounts.youtube.txt"
      - name: "yt hotspots agent record"
        agent_role: "hotspots"
      - name: "yt analyst agent record"
        agent_role: "analyst"

  kan.status_report:
    config:
      base_url: "https://kan.cool"
      endpoint_path: "/api/external/agent-status/report"
      env_file: ".env"
      report_key_env: "YOUTUBE_STATUS_REPORT_KEY"
      secret_env: "KAN_AGENT_STATUS_REPORT_SECRET"
      db_path: "runtime/youtube/db"
      state_file: "runtime/youtube/state/kan_status_report.json"
      log_files:
        - "log/avtdl.log"
      report_interval: 600
      stale_after_seconds: 900
      report_window_seconds: 86400
    entities:
      - name: "youtube hk status"
        feed_names:
          - "youtube keyword search"
          - "youtube HK keyword search"
          - "youtube TW keyword search"
          - "youtube APEC search"
          - "jintsumi community posts"
        normal_feed_names:
          - "youtube keyword search"
          - "youtube HK keyword search"
          - "youtube TW keyword search"
        apec_feed_names:
          - "youtube APEC search"

  mattermost:
    config:
      base_url: "https://kan.cool"
      env_file: ".env"
    entities:
      - name: "kan keyword groups"
        consume_record: false
        channels: &youtube_keyword_channels
          - "riro3ne5kbyqjgcwooedszrhyc"
          - "ta9wr1uag7n6mjax6hyaf8dndc"
          - "ky5cpcp7z3dhbb7kasg5ou63fa"
          - "yp6o8eykbpgw3f5m1j3895dfhh"
          - "49e5k748p3gx9neqfxyq7ij15c"
        channel_routes:
          keyword_group:
            general: *youtube_keyword_channels
            hk: &youtube_hk_channels
              - "riro3ne5kbyqjgcwooedszrhyc"
              - "ta9wr1uag7n6mjax6hyaf8dndc"
            tw: &youtube_tw_channels
              - "ky5cpcp7z3dhbb7kasg5ou63fa"
        message_template: "关键词分组：{keyword_group}\n命中关键词：{matched_keywords}\n\n推送原因：{push_reason}\n\n原YouTube链接：{url}"
      - name: "yt collector agent group"
        token_env: "YOUTUBE_AGENT_COLLECTOR_TOKEN"
        channels: *youtube_keyword_channels
        channel_routes:
          keyword_group:
            general: *youtube_keyword_channels
            hk: *youtube_hk_channels
            tw: *youtube_tw_channels
        required_fields:
          agent_role: "collector"
        message_template: |
          【YT 舆情线索快报】

          结论：近 {stats_window_hours} 小时采集到 {raw_collected_rows} 条公开记录，当前整理出 {valid_lead_count} 条可复核线索，{collector_conclusion}

          监测时间：{run_time}
          监测范围：{scope}
          关键词分组：{keyword_group}
          主要命中词：{top_keywords}
          涉及账号：{related_accounts}
          进入后续研判：{candidate_count} 条

          优先查看链接：
          {candidate_link_summaries}

          采集说明：{collector_note}
          下一步：继续判断是否形成重复传播或议题聚集。
      - name: "yt key accounts agent group"
        token_env: "YOUTUBE_AGENT_KEY_ACCOUNTS_TOKEN"
        channels: *youtube_keyword_channels
        channel_routes:
          keyword_group:
            general: *youtube_keyword_channels
            hk: *youtube_hk_channels
            tw: *youtube_tw_channels
        required_fields:
          agent_role: "key_accounts"
        message_template: |
          【YT 重点账号监测提醒】

          结论：本轮监测 {account_count} 个重点账号，新增动态 {new_post_count} 条，读取失败 {failed_count} 个，{key_account_conclusion}

          监测时间：{run_time}
          关键词分组：{keyword_group}
          成功读取：{success_count} 个
          账号状态记录：{state_file_count} 个
          已过滤重复内容：{duplicate_filtered_count} 条
          需补采账号：{failed_accounts}
          重点账号：{active_accounts}

          新增链接与内容简介：
          {key_event_link_summaries}

          处置建议：{key_account_action}
      - name: "yt hotspots agent group"
        token_env: "YOUTUBE_AGENT_HOTSPOTS_TOKEN"
        channels: *youtube_keyword_channels
        channel_routes:
          keyword_group:
            general: *youtube_keyword_channels
            hk: *youtube_hk_channels
            tw: *youtube_tw_channels
        required_fields:
          agent_role: "hotspots"
        message_template: |
          【YT 可关注议题提醒】

          结论：当前形成 {candidate_count} 个可关注议题，风险等级 {risk_level}，{hotspot_conclusion}

          监测时间：{run_time}
          关键词分组：{keyword_group}
          主要议题：{main_topics}
          需继续复核：{needs_analysis_count} 个
          关注原因：{hotspot_reason}

          代表链接与内容简介：
          {candidate_link_summaries}

          证据摘要：
          {evidence_summary}
          建议动作：{hotspot_action}
      - name: "yt analyst agent group"
        token_env: "YOUTUBE_AGENT_ANALYST_TOKEN"
        channels: *youtube_keyword_channels
        channel_routes:
          keyword_group:
            general: *youtube_keyword_channels
            hk: *youtube_hk_channels
            tw: *youtube_tw_channels
        required_fields:
          agent_role: "analyst"
        message_template: |
          【YT 舆情研判简报】

          结论：{executive_summary}

          报告时间：{run_time}
          风险等级：{risk_level}
          关键词分组：{keyword_group}

          重点发现：
          {key_findings}

          优先复核链接：
          {candidate_link_summaries}

          影响判断：
          {impact_assessment}

          建议动作：
          {analyst_action}

          备注：本简报基于 YouTube 公开数据整理，重要处置请结合人工复核。
      - name: "jintsumi key person group"
        channel_env: "JINTSUMI_MATTERMOST_CHANNEL_ID"
        token_env: "JINTSUMI_MATTERMOST_BOT_TOKEN"
        message_template: "**@jintsumi 重点人员监控**\n\n来源网址：{source_url}\n原文链接：{url}\n\
          发布时间：{published_text}\n作者：{author}\n\n原文内容：\n{content}\n\nAI 摘要：\n{ai_summary}\n\
          \n关键信息：\n{ai_key_points}\n\n风险等级：{ai_risk_level}\n关注建议：{ai_recommendation}\n\
          \nAI 判断依据：\n{push_reason}"
      - name: apec keyword group
        channel_env: APEC_MATTERMOST_CHANNEL_ID
        token_env: APEC_MATTERMOST_BOT_TOKEN
        message_template: |
          🚨【APEC 风险预警】

          等级：{risk_level}
          风险类型（研判分类）：{risk_type}

          事件：
          {title}

          原始抓取信息：
          - 平台：{source_platform}
          - 频道/作者：{author}
          - 原始平台发布时间：{published_text}
          - 原始来源：{url}

          监控信号：
          - 命中关键词：{matched_keywords}
          - 程序发现时间：{observed_at}
          - 当前来源数：{source_count} 条（{source_platform}）
          - 跨平台统计：{cross_platform_count} 个
          - 当前传播阶段：{spread_stage}
          - 数据说明：{statistical_note}

          风险叙事：
          {risk_narrative}

          涉及范围：
          {impact_scope}

          风险研判依据（仅基于上述抓取信息）：
          {push_reason}

          未来 6 小时：
          {forecast_note}

          建议关注：
          {recommendation}

          原始来源：
          {url}

          检索来源：
          {source_url}
chains:
  "youtube general keyword monitor":
    - channel:
        - "youtube keyword search"
    - filter.match:
        - "youtube keywords"
    - filter.deduplicate:
        - "youtube video deduplicate"
    - minimax.analyze:
        - "anti-china review"
    - mattermost:
        - "kan keyword groups"
    - youtube.keyword_agents:
        - "yt collector agent record"
        - "yt key accounts agent record"
        - "yt hotspots agent record"
        - "yt analyst agent record"
    - mattermost:
        - "yt collector agent group"
        - "yt key accounts agent group"
        - "yt hotspots agent group"
        - "yt analyst agent group"
  "youtube hk keyword monitor":
    - channel:
        - "youtube HK keyword search"
    - filter.match:
        - "youtube HK keywords"
    - filter.deduplicate:
        - "youtube HK video deduplicate"
    - minimax.analyze:
        - "hk anti-china review"
    - mattermost:
        - "kan keyword groups"
    - youtube.keyword_agents:
        - "yt collector agent record"
        - "yt key accounts agent record"
        - "yt hotspots agent record"
        - "yt analyst agent record"
    - mattermost:
        - "yt collector agent group"
        - "yt key accounts agent group"
        - "yt hotspots agent group"
        - "yt analyst agent group"
  "youtube tw keyword monitor":
    - channel:
        - "youtube TW keyword search"
    - filter.match:
        - "youtube TW keywords"
    - filter.deduplicate:
        - "youtube TW video deduplicate"
    - minimax.analyze:
        - "tw anti-china review"
    - mattermost:
        - "kan keyword groups"
    - youtube.keyword_agents:
        - "yt collector agent record"
        - "yt key accounts agent record"
        - "yt hotspots agent record"
        - "yt analyst agent record"
    - mattermost:
        - "yt collector agent group"
        - "yt key accounts agent group"
        - "yt hotspots agent group"
        - "yt analyst agent group"
  "jintsumi community monitor":
    - youtube.community:
        - "jintsumi community posts"
    - minimax.analyze:
        - "jintsumi community analysis"
    - mattermost:
        - "jintsumi key person group"
  apec keyword monitor:
    - channel:
        - youtube APEC search
    - filter.match:
        - apec keyword
    - filter.deduplicate:
        - apec video deduplicate
    - minimax.analyze:
        - apec anti-china review
    - mattermost:
        - apec keyword group
